<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-inline'; img-src {{cspSource}} data: https:;">
    <link rel="stylesheet" href="{{styleUri}}">
</head>

<body>
    <div class="header">
        <div class="top-row">
            <div class="left-badges">
                <div class="badge clickable disconnected" id="statusBadge" title="Google Cloud Connection Status">
                    <span class="status-dot"></span>
                    <span id="statusText">GCP : Disconnected</span>
                </div>
            </div>
            <div class="right-badges">
                <select id="langSelect" title="Target Language"></select>
                <button class="icon-btn" id="newChatBtn" title="New Chat Session">
                    <svg viewBox="0 0 16 16"><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/></svg>
                </button>
                <button class="icon-btn" id="historyBtn" title="Session History & Switcher">
                    <svg viewBox="0 0 16 16"><path d="M8.515 1.019A7 7 0 0 0 8 1a7 7 0 1 0 6.83 5.49a.5.5 0 0 0-.98-.204A6 6 0 1 1 8 2c.408 0 .805.04 1.189.117L8.146 3.164a.5.5 0 0 0 .708.707l2-2a.5.5 0 0 0 0-.707l-2-2a.5.5 0 1 0-.708.707l.369.348z"/><path d="M8 3.5a.5.5 0 0 0-.5.5v4a.5.5 0 0 0 .246.432l3 1.732a.5.5 0 1 0 .508-.864L8.5 7.732V4a.5.5 0 0 0-.5-.5z"/></svg>
                </button>
                <button class="icon-btn" id="exportBtn" title="Export conversation to Markdown (.agents/artifacts/)">
                    <svg viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8zm15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V4.5z" />
                    </svg>
                </button>
                <button class="icon-btn" id="settingsBtn" title="Open Settings (agentPlatform)">
                    <svg viewBox="0 0 16 16">
                        <path
                            d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z" />
                        <path
                            d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319z" />
                    </svg>
                </button>
            </div>
        </div>
        <div class="bottom-row">
            <select id="modelSelect" title="LLM Model"></select>
        </div>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-wrapper">
        <div class="input-card">
            <div class="image-preview-bar" id="imagePreviewBar"></div>
            <textarea id="promptInput" rows="1"
                placeholder="Type a message... (Enter to send, Shift+Enter for new line)"></textarea>
            <div class="input-toolbar">
                <div class="toolbar-left">
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    <button class="toolbar-btn" id="attachBtn" title="Attach image (or Ctrl+V to paste)">
                        <svg viewBox="0 0 16 16">
                            <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" />
                            <path
                                d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z" />
                        </svg>
                    </button>
                </div>
                <div class="toolbar-right">
                    <button class="send-btn-circle" id="sendBtn" title="Send message (Enter)" disabled>
                        <svg viewBox="0 0 16 16">
                            <path fill-rule="evenodd"
                                d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{markdownScriptUri}}"></script>
    <script src="{{scriptUri}}"></script>
</body>

</html>
