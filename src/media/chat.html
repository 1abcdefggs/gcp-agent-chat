<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-inline'; img-src {{cspSource}} data: https:;">
    <link rel="stylesheet" href="{{styleUri}}">
</head>

<body class="rich-ui">
    <div class="header">
        <div class="top-row">
            <div class="left-badges">
                <div class="spectrum-orb state-idle" id="spectrumOrb" title="Gemini Intelligence State (Idle / Thinking / Replying)"></div>
                <div class="badge clickable disconnected" id="statusBadge" title="Google Cloud Connection Status">
                    <svg class="badge-gcp-icon" viewBox="0 0 512 512" width="12" height="12"><path d="M256.083,438.958h-.025c-6.531-.01-12.403-3.982-14.831-10.046-.21-.521-21.989-53.918-63.233-94.966-41.269-41.072-94.336-62.688-94.867-62.902-6.066-2.438-10.046-8.326-10.039-14.865.007-6.537,3.983-12.415,10.053-14.842.964-.39,53.504-21.883,94.854-63.036,41.476-41.278,63-94.697,63.213-95.231,2.422-6.092,8.316-10.098,14.871-10.098h.017c6.562.007,12.456,4.012,14.867,10.113.206.521,21.716,53.924,63.206,95.216,41.538,41.341,94.333,62.827,94.861,63.039,6.064,2.436,10.045,8.316,10.045,14.852s-3.969,12.416-10.033,14.851c-.52.209-53.737,21.965-94.874,62.904-41.11,40.916-63.029,94.463-63.245,94.999-2.444,6.048-8.317,10.013-14.838,10.013h-.002ZM125.551,256.183c21.069,11.566,49.712,29.899,75.016,55.082,25.399,25.278,43.886,54.093,55.524,75.267,11.659-21.198,30.162-50.046,55.502-75.267,25.252-25.131,53.939-43.484,75.035-55.069-21.021-11.563-49.611-29.911-75.035-55.213-25.47-25.349-43.907-54.14-55.514-75.348-11.608,21.21-30.048,50.005-55.512,75.348-25.409,25.288-53.996,43.635-75.017,55.2h0Z" fill="currentColor"/></svg>
                    <span class="status-dot"></span>
                    <span id="statusText">GCP : Disconnected</span>
                </div>
            </div>
            <div class="right-badges">
                <select id="langSelect" title="Target Language"></select>
                <button class="icon-btn active" id="toggleEffectsBtn" title="Toggle Rich Gemini Visual Effects (ON/OFF)">
                    <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4 7.6 2.6-7.6 2.6L12 22l-2.4-7.4L2 12l7.6-2.6L12 2z"/></svg>
                </button>
                <button class="icon-btn" id="newChatBtn" title="New Chat Session">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
                <button class="icon-btn" id="historyBtn" title="Session History & Switcher">
                    <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 9-9 9 9 0 0 0-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                </button>
                <button class="icon-btn" id="exportBtn" title="Export conversation to Markdown (.agents/artifacts/)">
                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                </button>
                <button class="icon-btn" id="settingsBtn" title="Open Settings (gcpAgentChat)">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
            </div>
        </div>
        <div class="bottom-row">
            <select id="modelSelect" title="LLM Model"></select>
        </div>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-wrapper" id="inputWrapper">
        <div class="input-card">
            <div class="image-preview-bar" id="imagePreviewBar"></div>
            <textarea id="promptInput" rows="1"
                placeholder="Type a message... (Enter to send, Shift+Enter for new line)"></textarea>
            <div class="input-toolbar">
                <div class="toolbar-left">
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    <button class="toolbar-btn" id="attachBtn" title="Attach image (or Ctrl+V to paste)">
                        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    </button>
                </div>
                <div class="toolbar-right">
                    <button class="send-btn-circle" id="sendBtn" title="Send message (Enter)" disabled>
                        <svg viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>window.LOGO_URI = '{{logoUri}}';</script>
    <script src="{{markdownScriptUri}}"></script>
    <script src="{{scriptUri}}"></script>
</body>

</html>
